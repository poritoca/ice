/* v37: genuine full-viewport sideways game instead of squeezed portrait columns. */
/* The reverse toggle must ignore the original physical-landscape media grid. */
#app.virtualPortrait{display:flex!important;flex-direction:column!important;justify-content:flex-start;align-items:stretch;gap:5px;overflow:hidden;padding:7px 8px 5px!important}
#app.virtualPortrait header{display:flex;flex:0 0 29px;height:29px}
#app.virtualPortrait .hud{display:grid;flex:0 0 auto;padding:5px 10px}
#app.virtualPortrait .value{font-size:18px}
#app.virtualPortrait .timer{flex:0 0 3px;margin-top:-3px}
#app.virtualPortrait .stagebar{display:flex;flex:none;font-size:9px}
#app.virtualPortrait #arena{display:flex;flex:1 1 auto!important;height:auto!important;min-height:60px;min-width:0;width:100%}
#app.virtualPortrait #controls{flex:0 0 auto;flex-direction:row!important;align-items:center!important;justify-content:center;gap:8px!important;height:auto!important;width:100%}
#app.virtualPortrait #controls .controlinfo{flex:1 1 auto;max-width:230px;min-width:0}
#app.virtualPortrait #routePanel{flex:none;max-height:38%;overflow-y:auto;touch-action:pan-y}
#app.virtualPortrait .legend{display:none}

html,body{width:100%;height:100%;overflow:hidden}
body.forceLandscape,body.forcePortrait{overscroll-behavior:none}
#app.landscapeUI{box-sizing:border-box;max-width:none;width:100%;height:100dvh;grid-template-columns:minmax(0,1fr) clamp(245px,40%,328px);grid-template-rows:27px 42px 3px 18px minmax(0,1fr);gap:4px;padding:4px 7px 5px;align-content:stretch;overflow:hidden}
#app.landscapeUI header{grid-area:1/1/2/3;height:27px}

#app.virtualLandscape,body.forceLandscape .overlay{position:fixed!important;left:100vw!important;top:0!important;width:100dvh!important;height:100vw!important;max-width:none!important;max-height:none!important;transform-origin:top left;transform:rotate(90deg);margin:0!important;z-index:auto}

<script id="engine">

// Test contact before either actor advances AND after advancement: entering an
// occupied cell and crossing a projectile cannot disappear between ticks.
// Enemies may enter the hero tile. Contact is lethal for a human player;
// certified auto-runs and demonstration playback use a visible emergency defense
// when movement would otherwise cause an unavoidable collision. This works even
// if the currently equipped weapon cannot reach the target or has no ammo.
function autoContactGuard(enemy=null,shot=null){
 if(!enemy&&!shot)return false;
 const now=performance.now(),q=pos;
 const palette={outline:'#34516d',shadow:'#6688a2',body:'#a9ecff',core:'#fffde3'};
 blastFX.push({p:q,at:now,r:1,color:'#baf5ff',palette,effect:'megablast'});
 if(blastFX.length>32)blastFX.shift();
 sparks.push({p:q,life:18,color:'#c7faff'});
 if(enemy&&entities.includes(enemy)){
   damageWeaponEnemy(enemy,Math.max(enemy.hp??enemyHP(enemy.type),enemyHP(enemy.type)),{palette,effect:'megablast',autoPierce:true});
 }
 if(shot){const i=shots.indexOf(shot);if(i>=0)shots.splice(i,1);}
 beep(750,.05,'triangle');
 return true;
}
function worldCollision(){
 if(!['playing','route'].includes(mode))return false;
 const assisted=mode==='route'||(mode==='playing'&&!!autoRun);
 const enemy=entities.find(e=>e.p===pos);
 if(enemy){
   if(assisted){autoContactGuard(enemy,null);}
   else{die(enemyNames[enemy.type]+'にぶつかった');return true;}
 }
 const shot=shots.find(s=>s.p!==null&&s.p===pos);
 if(shot){
   if(assisted){autoContactGuard(null,shot);}
   else{die((enemyNames[shot.kind]||'敵')+'の飛び道具に当たった');return true;}
 }
 return false;
}

// Frostbound original defeat effect: twelve ice-energy motes burst radially like a retro action game.
// It uses original pixel shapes (no sprites/assets/audio sampled from other games).
const DEATH_FX_MS=1250;
function drawDeathBurst(now,cx,cy){
  const age=Math.max(0,now-deathAt);
  const over=age>=DEATH_FX_MS;
  ctx.save();
  ctx.imageSmoothingEnabled=false;
  // A short silhouette remains at the impact moment. No repeated hard flashes.
  if(age<145){
    const a=1-age/145;
    ctx.globalAlpha=a;
    if(age<95){character(cx-12,cy-12,deathAt,false);}
    const bloom=5+age*.11;
    ctx.globalCompositeOperation='screen';
    const gradient=ctx.createRadialGradient(cx,cy,0,cx,cy,bloom);
    gradient.addColorStop(0,'rgba(255,255,255,.95)');
    gradient.addColorStop(.45,'rgba(178,240,255,.55)');
    gradient.addColorStop(1,'rgba(105,202,244,0)');
    ctx.fillStyle=gradient;ctx.beginPath();ctx.arc(cx,cy,bloom,0,Math.PI*2);ctx.fill();
  }
  // Expanding icy shock ring, drawn as stepped pixels to match the game's 24px tile art.
  if(age<480){
    const wave=Math.min(1,age/480),rad=4+wave*36;
    ctx.globalCompositeOperation='screen';ctx.globalAlpha=.68*(1-wave);
    ctx.strokeStyle='#87defa';ctx.lineWidth=wave<.46?3:2;
    ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='#fff7e6';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(cx,cy,rad-3,0,Math.PI*2);ctx.stroke();
  }
  // Twelve crisp glowing orbs radiate outward. Each has a faint trailing echo and 3-tone core.
  if(age>=105&&!over){
    const travel=Math.min(1,(age-105)/920),eased=1-Math.pow(1-travel,1.17);
    const fade=Math.min(1,(DEATH_FX_MS-age)/340);
    for(let j=0;j<12;j++){
      const angle=-Math.PI/2+j*Math.PI/6, speed=(j%3===0?1.10:j%3===1?.98:1.06);
      const vx=Math.cos(angle),vy=Math.sin(angle),r=(6+83*eased)*speed;
      const bx=cx+vx*r,by=cy+vy*r;
      ctx.globalCompositeOperation='screen';
      for(let k=2;k>=1;k--){
        const trailR=r-k*(10+4*travel),tx=cx+vx*trailR,ty=cy+vy*trailR;
        ctx.globalAlpha=(.18+(2-k)*.10)*fade;
        rect(tx-2,ty-2,5,5,'#77c5ed');
      }
      ctx.globalAlpha=Math.max(0,fade)*(j%2?.93:1);
      ctx.globalCompositeOperation='source-over';
      const bounce=age<290?1.12:age>910?.75:1;
      const sz=(j%3===0?11:9)*bounce;
      // Chunky original pixel circle with alternating pale-blue edge pixels.
      rect(bx-sz/2-2,by-sz/2-1,sz+4,sz+2,'#123855');
      rect(bx-sz/2-1,by-sz/2-2,sz+2,sz+4,'#123855');
      rect(bx-sz/2,by-sz/2,sz,sz,'#6cc5f3');
      rect(bx-sz/2+1,by-sz/2-1,sz-2,sz+2,'#c5f1ff');
      rect(bx-sz/2+2,by-sz/2+1,Math.max(2,sz-4),Math.max(2,sz-3),'#fffef2');
      // 4-point flickering sparkle, but only a gentle glint (no full-screen strobe).
      if((Math.floor(age/115)+j)%3===0){
        ctx.globalAlpha=.7*fade;
        rect(bx-1,by-sz/2-4,2,3,'#e8ffff');
        rect(bx-1,by+sz/2+1,2,3,'#d4f6ff');
        rect(bx-sz/2-4,by-1,3,2,'#d4f6ff');
        rect(bx+sz/2+1,by-1,3,2,'#e8ffff');
      }
    }
  }
  // After the energy spheres disperse, leave an unmistakable short MISS indicator.
  if(age>720){
    const a=Math.min(1,(age-720)/160);
    ctx.globalAlpha=a;ctx.globalCompositeOperation='source-over';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 16px monospace';
    rect(cx-29,cy-34,58,22,'#18334d');
    rect(cx-26,cy-31,52,2,'#7fbed7');
    ctx.fillStyle='#0b1929';ctx.fillText('MISS!',cx+1,cy-21);
    ctx.fillStyle='#fff9e5';ctx.fillText('MISS!',cx,cy-22);
  }
  ctx.restore();
}

function fbBoardTorches(b){

  let p=y*b.w+x;
  if(!b.cells[p])continue;
  let edge=[p-1,p+1,p-b.w,p+b.w].some(q=>q>=0&&q<b.cells.length&&!b.cells[q]);if(!edge)continue;

}

}

function arcadeDrawZone(c,z,color,u){

 c.beginPath();
 if(z.kind==='circle')c.arc(z.x,z.y,z.r,0,Math.PI*2);
 else{c.lineCap='round';c.lineWidth=z.r*2;c.moveTo(z.a.x,z.a.y);c.lineTo(z.b.x,z.b.y);}
 c.stroke();
 if(z.kind==='circle'){c.fill();c.globalAlpha=.42*(1-u);c.lineWidth=1;c.stroke();}
 c.restore();
}
function arcadeDrawFootprint(c,f,u){

 for(let z of f.zones)arcadeDrawZone(c,z,f.color,u);
 // Small universal four-pixel diamond on each real attackable tile. Walls are excluded.
 const r=Math.max(1.2,2.4-u*1.2);
 for(let p of f.tiles||[]){let q=arcadeXY(p);
  c.strokeStyle='#faffdf';c.lineWidth=1;c.beginPath();c.moveTo(q.x,q.y-r-2);c.lineTo(q.x+r+2,q.y);
  c.lineTo(q.x,q.y+r+2);c.lineTo(q.x-r-2,q.y);c.closePath();c.stroke();

 }

}

function arcadeDrawHitBurst(c,f,t){

  c.strokeStyle=f.color;c.lineWidth=2;c.beginPath();c.arc(x,y,3+u*11,0,Math.PI*2);c.stroke();

   let r=4+u*(9+random(i+20)*11),size=1.5+(1-u)*2;
   c.fillStyle=i%3===0?'#fffafa':f.color;
   c.fillRect(x+Math.cos(angle)*r-size/2,y+Math.sin(angle)*r-size/2,size,size);

   let dist=4+u*(19+random(i+19)*(f.elite?24:14));

 }
 c.restore();

const V55_TYPES=Object.keys(V55_INFO);

function v55HitCells(cells,power,style,s,limit=1,kind='hit'){

  const area=shape==='lifegrid'?[-2,-1,0,1,2]:[-3,-2,-1,0,1,2,3];
  const [x,y]=v55XY(c),out=[];
  for(const dy of area)for(const dx of (shape==='lifegrid'?[-2,-1,0,1,2]:[-2,-1,0,1,2])){
   let q=v55P(x+dx,y+dy);if(v55Legal(q))out.push(q);
  }

  let near=entities.filter(e=>v55Near(p,e.p)<=7&&v55Path(p,e.p,15).length);
  return [...new Set([...front,...near.map(e=>e.p)])];
 }

  const [x,y]=v55XY(c),out=[];
  for(let i=-4;i<=4;i++){
   const q=v55P(x+(d%2===0?i:0),y+(d%2===1?i:0));

  }

}
function v55Attack(w,now,power){
 if(!board)return;

function v55LifeStep(cells,center){

  const q=v55P(x,y);if(!v55Legal(q))continue;
  let n=0;for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++)if((xx||yy)&&cells.has(v55P(x+xx,y+yy)))n++;
  if(n===3||(cells.has(q)&&n===2))next.add(q);

}
function v55Advance(){

  const age=++s.age,k=s.kind,style=s.style;

function toolAvailable(k){if(simpleMode)return false;if(k==='pickaxe')return false;if(k==='compass'&&noClock())return false;return !watchMode&&!practiceMode&&!customSession&&(meta.inventory[k]||0)>0&&!meta.claimed.includes(claimKey('tool:'+k));}

function safeToolPath(b,p=pos,m=mask){if(p!==pos&&(entities.some(e=>e.p===p)||shots.some(e=>e.p===p))){toast('移動先に敵・弾があります。道具は消費しません');return null;}let path=solve(b,p,m,180000,clockPhase,broken);if(!path){toast('安全な経路を確認できません。道具は消費しません');return null;}return path;}

function excavate(q){if(!pickaxeTarget)return false;if(motion)return true;let x=q%board.w,y=q/board.w|0;if(distance(pos,q)!==1||!board.cells[q]||x<=0||y<=0||x>=board.w-1||y>=board.h-1){toast('隣接する内側の壁を選んでください');return true;}let test=prepare(clone(board));test.cells[q]=0;let path=safeToolPath(test);if(!path)return true;let template=prepare(clone(stageTemplate));template.cells[q]=0;let shortest=solve(template,template.start,0,180000,0,0);if(!shortest){toast('初期状態の解答を確認できません。消費しません');return true;}if(!spendTool('pickaxe')){pickaxeTarget=false;return true;}board=test;template.path=shortest;let cp=template.start,cm=0,ct=0,cz=0,cb=0;for(let a of shortest){for(let i=0;i<a.wait;i++){ct=(ct+1)%PERIOD;cz=contact(template,cp,ct,cz).broken;cb++;}let v=slide(template,cp,cm,a.d,ct,cz);cp=v.p;cm=v.m;ct=v.phase;cz=v.broken;cb+=v.trace.length;}template.beats=cb;template.tiles=cb;template.waits=shortest.reduce((n,a)=>n+a.wait,0);board.path=clone(shortest);board.beats=cb;stageTemplate=rawBoard(template);history=[];effort+=3;pickaxeTarget=false;baseBoard=null;safeMemo.clear();cacheSafePath(pos,mask,clockPhase,path,broken);protectPath(pos,mask,clockPhase,broken,path);updateMoves();sparks.push({p:q,life:20,color:'#ffe2ae'});toast('壁を破壊！ 最短ルートを再計算しました');return true;}
function useLife(){if(simpleMode)return;if(mode!=='dead'||meta.lives<1||watchMode||practiceMode||customSession)return;if(!noClock()&&performance.now()>=deadline){endAttempt('TIME UP');return;}if(!history.length){toast('戻せる手がありません。開始地点への復帰を使ってください');return;}if(!commitMeta(m=>m.lives--))return;let h=history.pop();effort++;restoreHistory(h);mode='playing';$('deathPanel').style.display='none';$('controls').style.display='flex';$('status').textContent='ライフで復帰 · 時間消費なし';}

function validateCustom(input){let b=clone(input);if(b.format!=='frostbound'||b.version!==1)throw Error('対応形式は frostbound version 1 です');if(!Number.isInteger(b.w)||!Number.isInteger(b.h)||b.w<5||b.w>31||b.h<5||b.h>31)throw Error('サイズは5〜31');let n=b.w*b.h,valid=q=>Number.isInteger(q)&&q>=0&&q<n;if(!Array.isArray(b.cells)||b.cells.length!==n||b.cells.some(x=>x!==0&&x!==1))throw Error('床データが不正');if(!valid(b.start)||!valid(b.goal)||b.start===b.goal||b.cells[b.start]||b.cells[b.goal])throw Error('開始・ゴールは異なる氷床に配置してください');if(!Array.isArray(b.frag)||b.frag.length>12||new Set(b.frag).size!==b.frag.length||b.frag.some(q=>!valid(q)||b.cells[q]||q===b.start||q===b.goal))throw Error('薄氷は開始・ゴール以外に最大12枚');if(!Array.isArray(b.hazards)||b.hazards.length>30)throw Error('仕掛けは最大30基');let used=new Set();for(let h of b.hazards){if(!(['spike','pendulum','rock','fire'].includes(h.type)||EXTRA_HAZARDS[h.type])||!Number.isInteger(h.offset)||h.offset<0||h.offset>11)throw Error('仕掛けの種類・位相が不正');let zone;if(EXTRA_HAZARDS[h.type]){if(!valid(h.p)||!Number.isInteger(h.d)||h.d<0||h.d>3)throw Error('配置座標・方向が不正');let made=makeExtra(h.type,h.p,h.d,b.w,b.h,h.offset);if(!made||JSON.stringify(made.path)!==JSON.stringify(h.path))throw Error('新ギミックの形状が不正');zone=h.path;}else if(h.type==='spike')zone=[h.p];else{let count=h.type==='pendulum'?5:h.type==='rock'?3:4;if(!Array.isArray(h.path)||h.path.length!==count)throw Error('仕掛けの長さが不正');zone=h.type==='fire'?[h.wall,...h.path]:h.path;if(h.type==='pendulum'&&h.anchor!==h.path[2])throw Error('振り子の支点が不正');let d=zone[1]-zone[0];if(![1,-1,b.w,-b.w].includes(d)||zone.some((q,i)=>i&&(q-zone[i-1]!==d||Math.abs(q%b.w-zone[i-1]%b.w)+Math.abs((q/b.w|0)-(zone[i-1]/b.w|0))!==1)))throw Error('仕掛けは直線に配置');}if(zone.some(q=>!valid(q)||b.cells[q]||q===b.start||q===b.goal||used.has(q)))throw Error('仕掛けが壁・開始・ゴール・別の仕掛けと重なっています');zone.forEach(q=>used.add(q));}if(!Array.isArray(b.monsters)||b.monsters.length>80)throw Error('敵は最大80体');let occupied=new Set();for(let e of b.monsters){if( function certifyCustom(input){let b=prepare(validateCustom(input));let search=prepare(clone(b));let path=solve(search,search.start,0,180000);if(!path)throw Error(solve.lastLimited?'探索上限。仕掛けや薄氷を減らしてください。':'安全な解答を確認できません。配置を調整してください。');b.path=path;let p=b.start,m=0,t=0,z=0,beats=0;for(let a of path){for(let k=0;k<a.wait;k++){t=(t+1)%PERIOD;let h=contact(b,p,t,z);if(h.dead)throw Error('待機中の衝突');z=h.broken;beats++;}let v=slide(b,p,m,a.d,t,z);if(v.dead)throw Error('走行中の衝突');p=v.p;m=v.m;t=v.phase;z=v.broken;beats+=v.trace.length;}if(p!==b.goal)throw Error('ゴールに到達できません');b.beats=beats;b.tiles=beats;b.waits=path.reduce((n,a)=>n+a.wait,0);b.used=b.frag.filter((q,i)=>(m>>>(i*2)&3)>0).length;b.twice=0;return b;}

function bossAim(b){

 if(human){let d=readStick();if(d[0]||d[1]){b.aimX=d[0];b.aimY=d[1];}}
 const enemies=cpuVisualContacts(b).filter(a=>(a.float||0)<=0&&!a.spectator);
 const preferred=b.aiTarget&&enemies.find(a=>a.id===b.aiTarget.id);
 const target=human?(auto?enemies.sort((a,c)=>Number(a.guard)-Number(c.guard)||distanceTo(b,a)-distanceTo(b,c))[0]:null):preferred||enemies.sort((a,c)=>Number(a.guard)-Number(c.guard)||distanceTo(b,a)-distanceTo(b,c))[0];

function bossDisk(x,y,r,inner=0,gaps=0,phase=0){let cells=new Set();for(let yy=Math.floor(y-r);yy<=y+r;yy++)for(let xx=Math.floor(x-r);xx<=x+r;xx++){let d=Math.hypot(xx+.5-x,yy+.5-y);if(!inside(xx,yy)||d>r||d<inner)continue;if(gaps){let angle=Math.atan2(yy+.5-y,xx+.5-x)-phase,sector=Math.PI*2/gaps,near=Math.abs(((angle%sector)+sector+sector/2)%sector-sector/2);if(d*Math.sin(near)<.65)continue;}cells.add(cell(xx,yy));}return cells;}

else if(id==='vortex'){let x=b.x+dx*6,y=b.y+dy*6;for(let i=0;i<3;i++)pulses.push(bossPulse(bossDisk(x,y,3.2,0,4,.35),.7+i*.65,x,y,{pull:i<2,mult:i<2?.4:1.1}));}

else if(id==='chain'){if(!foes.length){say('雷を落とせる敵がまだいません');return false;}for(let [i,target] of foes.slice(0,3).entries())pulses.push(bossPulse(bossDisk(target.x,target.y,1.15),.55+i*.22,b.x,b.y));}

b.skillCD[id]=info[2];b.skillLock=s.t+.22;if(id==='leap')b.cool=info[2];b.skillUsage??={};b.skillUsage[id]=(b.skillUsage[id]||0)+1;b.lastAIAbility=id;say((byAI?'巨獣：':'')+info[1]+'！ '+(id==='leap'?'空中で方向調整 → 着地で大地震':id==='missile'?'12秒追跡':'発動'));if(b.controlled)bossHud();return true;}
function tickBossMissiles(dt){let b=s.boss;if(!b?.alive){s.bossMissiles=[];return;}for(let m of s.bossMissiles||[]){m.left-=dt;m.age+=dt;let foes=opponents(b).filter(a=>(a.float||0)<=0&&(a.inv||0)<=0),target=foes.find(a=>a.id===m.target);if(!target){target=foes.sort((a,c)=>Math.hypot(m.x-a.x,m.y-a.y)-Math.hypot(m.x-c.x,m.y-c.y))[0];if(target)m.target=target.id;}if(target){let wanted=Math.atan2(target.y-m.y,target.x-m.x),diff=Math.atan2(Math.sin(wanted-m.angle),Math.cos(wanted-m.angle));m.angle+=clamp(diff,-2.8*dt,2.8*dt);}let steps=Math.max(1,Math.ceil(3.5*dt/.12)),hit=null;for(let i=0;i<steps&&!hit;i++){m.x+=Math.cos(m.angle)*3.5*dt/steps;m.y+=Math.sin(m.angle)*3.5*dt/steps;if(m.age>.4)hit=foes.find(a=>Math.hypot(a.x-m.x,a.y-m.y)<.6+(a.guard?.15:0));}m.trail.push([m.x,m.y]);if(m.trail.length>18)m.trail.shift();if(hit){let c={id:m.id,owner:b.id,bossId:b.id,w:{id:'seeker',name:'執念弾'},power:16*bossPower(b),dx:Math.cos(m.angle),dy:Math.sin(m.angle),hits:{},originX:b.x,originY:b.y},p=bossPulse(bossDisk(m.x,m.y,1.15),0,m.x-Math.cos(m.angle),m.y-Math.sin(m.angle));for(let foe of foes)if(pulseHits(p,foe))push(b,foe,c,p);emitShot(c,p);m.left=0;}if(!inside(m.x,m.y))m.left=0;}s.bossMissiles=(s.bossMissiles||[]).filter(m=>m.left>0);}

// v90: weapon pulses crack roughly one half of the *intact* tiles actually
// reached, using the same group timer/ownership/respawn system as footfalls.
// Seeing a group once per cast prevents a multi-pulse or echo weapon from
// eventually cracking 100% of its overlapping footprint.
function weaponCrackPulse(c,p){
 if(!s||trialReturn||c.bossId||c.summonId||c.w?.name==='流星着地')return 0;
 const shooter=entity(c.owner);
 if(!shooter?.alive||shooter.guard||shooter.boss||!p?.cells?.size)return 0;
 const seen=c.crackSeen??(c.crackSeen=new Set()),land=s.lands[s.layer],layer=s.layers[s.layer];
 const home=inside(shooter.x,shooter.y)?cell(shooter.x,shooter.y):-1,available=[];
 for(const q of p.cells){
  const t=layer[q],gid=t?.group;
  if(gid===undefined||gid<0||seen.has(gid))continue;
  const gr=land.groups[gid];
  if(!gr||gr.hold>s.t||gr.end<=s.t+1.25||gr.cells.includes(home))continue;
  seen.add(gid);available.push(gr);
 }
 if(!available.length)return 0;
 // The per-cast cap prevents very large area spells from destroying an island in one hit.
 const cap=s.raid?18:28,remaining=Math.max(0,cap-(c.crackCount||0));
 let want=Math.floor(available.length*.5);
 if(available.length%2&&Math.random()<.5)want++;
 let changed=0;
 for(const gr of shuffled(available).slice(0,Math.min(want,remaining))){
  let lifespan=gr.end-s.t;
  if(!Number.isFinite(gr.end)){
   // Minimum warning time avoids unreactable sudden falls, even late in a round.
   let wait=Math.max(1.8,(floorLife()+.75+Math.min(.2,gr.cells.length*.035))*(1-.14*lv(shooter,'fracture')));
   gr.start=s.t;gr.end=s.t+wait;
  }else{
   // Fun follow-up: a second attack makes existing cracks collapse sooner.
   // Once per 0.9 s and never without at least 1.15 s warning.
   if(s.t-(gr.crackLastHit??-1e5)<.9||lifespan<=1.35)continue;
   gr.end=s.t+Math.max(1.15,lifespan*.68);
  }
  gr.owner=shooter.id;gr.weaponCrack=true;gr.crackLastHit=s.t;
  for(const q of gr.cells)Object.assign(layer[q],{start:gr.start,end:gr.end,owner:shooter.id});
  changed++;
 }
 c.crackCount=(c.crackCount||0)+changed;
 if(changed&&shooter.id===0&&s.t-(s.crackNoticeAt||-100)>3){s.crackNoticeAt=s.t;say('攻撃が氷を破砕！ ひび割れ床は時間差で崩落');}
 return changed;
}
