 --fb-left-rail:clamp(122px,15.5vw,144px);

 grid-template-columns:repeat(3,var(--fb-dpad-edge))!important;

 justify-self:end!important;

}

 height:var(--fb-dpad-edge)!important;
 font-size:24px!important;
}

  --fb-left-rail:max(240px, calc(env(safe-area-inset-left,0px) + 192px));

   Use the top inset plus a deliberate finger-safe margin. */

}

body.fbIphone #app.virtualLandscape header>div:first-child{

function measuredBoardSpace(){

  const cells=w*h;

  const pixel=Math.min(aw/w,ah/h);

function v54OnEnemyDeath(e){
 const near=entities.filter(o=>o!==e&&ENEMY_EXTRA[o.type]?.harvest&&distance(o.p,e.p)<=4);
 for(const o of near){o.harvestCount=(o.harvestCount||0)+1;if(o.harvestCount<=3)o.hp=Math.min(enemyHP(o.type),(o.hp??enemyHP(o.type))+9);}
}
function v54EnemyMove(e,spec){

 const options=[];
 for(let d=0;d<4;d++){let q=ray(e.p,d,1)[0];if(q!==undefined&&freeForEntity(q))options.push({q,d});}
 if(!options.length)return 'stay';
 let score=({q,d})=>{
  if(spec.evade)return distance(q,pos)*3+(d===e.lastD?1:0);
  if(spec.strafe){let dx=pos%board.w-e.p%board.w,dy=(pos/board.w|0)-(e.p/board.w|0);
    return Math.abs(dx)>Math.abs(dy)?(d===0||d===2?5:0):(d===1||d===3?5:0);}
  let x=q%board.w,y=q/board.w|0,wall=0;
  for(let [xx,yy] of DIRS){let a=x+xx,b=y+yy;if(a<0||b<0||a>=board.w||b>=board.h||board.cells[b*board.w+a])wall++;}

// Frostbound original defeat effect: twelve ice-energy motes burst radially like a retro action game.
// It uses original pixel shapes (no sprites/assets/audio sampled from other games).
const DEATH_FX_MS=1250;
function drawDeathBurst(now,cx,cy){
  const age=Math.max(0,now-deathAt);
  const over=age>=DEATH_FX_MS;
  ctx.save();
  ctx.imageSmoothingEnabled=false;
  // A short silhouette remains at the impact moment. No repeated hard flashes.
  if(age<145){
    const a=1-age/145;
    ctx.globalAlpha=a;
    if(age<95){character(cx-12,cy-12,deathAt,false);}
    const bloom=5+age*.11;
    ctx.globalCompositeOperation='screen';
    const gradient=ctx.createRadialGradient(cx,cy,0,cx,cy,bloom);
    gradient.addColorStop(0,'rgba(255,255,255,.95)');
    gradient.addColorStop(.45,'rgba(178,240,255,.55)');
    gradient.addColorStop(1,'rgba(105,202,244,0)');
    ctx.fillStyle=gradient;ctx.beginPath();ctx.arc(cx,cy,bloom,0,Math.PI*2);ctx.fill();
  }
  // Expanding icy shock ring, drawn as stepped pixels to match the game's 24px tile art.
  if(age<480){
    const wave=Math.min(1,age/480),rad=4+wave*36;
    ctx.globalCompositeOperation='screen';ctx.globalAlpha=.68*(1-wave);
    ctx.strokeStyle='#87defa';ctx.lineWidth=wave<.46?3:2;
    ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='#fff7e6';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(cx,cy,rad-3,0,Math.PI*2);ctx.stroke();
  }
  // Twelve crisp glowing orbs radiate outward. Each has a faint trailing echo and 3-tone core.
  if(age>=105&&!over){
    const travel=Math.min(1,(age-105)/920),eased=1-Math.pow(1-travel,1.17);
    const fade=Math.min(1,(DEATH_FX_MS-age)/340);
    for(let j=0;j<12;j++){
      const angle=-Math.PI/2+j*Math.PI/6, speed=(j%3===0?1.10:j%3===1?.98:1.06);
      const vx=Math.cos(angle),vy=Math.sin(angle),r=(6+83*eased)*speed;
      const bx=cx+vx*r,by=cy+vy*r;
      ctx.globalCompositeOperation='screen';
      for(let k=2;k>=1;k--){
        const trailR=r-k*(10+4*travel),tx=cx+vx*trailR,ty=cy+vy*trailR;
        ctx.globalAlpha=(.18+(2-k)*.10)*fade;
        rect(tx-2,ty-2,5,5,'#77c5ed');
      }
      ctx.globalAlpha=Math.max(0,fade)*(j%2?.93:1);
      ctx.globalCompositeOperation='source-over';
      const bounce=age<290?1.12:age>910?.75:1;
      const sz=(j%3===0?11:9)*bounce;
      // Chunky original pixel circle with alternating pale-blue edge pixels.
      rect(bx-sz/2-2,by-sz/2-1,sz+4,sz+2,'#123855');
      rect(bx-sz/2-1,by-sz/2-2,sz+2,sz+4,'#123855');
      rect(bx-sz/2,by-sz/2,sz,sz,'#6cc5f3');
      rect(bx-sz/2+1,by-sz/2-1,sz-2,sz+2,'#c5f1ff');
      rect(bx-sz/2+2,by-sz/2+1,Math.max(2,sz-4),Math.max(2,sz-3),'#fffef2');
      // 4-point flickering sparkle, but only a gentle glint (no full-screen strobe).
      if((Math.floor(age/115)+j)%3===0){
        ctx.globalAlpha=.7*fade;
        rect(bx-1,by-sz/2-4,2,3,'#e8ffff');
        rect(bx-1,by+sz/2+1,2,3,'#d4f6ff');
        rect(bx-sz/2-4,by-1,3,2,'#d4f6ff');
        rect(bx+sz/2+1,by-1,3,2,'#e8ffff');
      }
    }
  }
  // After the energy spheres disperse, leave an unmistakable short MISS indicator.
  if(age>720){
    const a=Math.min(1,(age-720)/160);
    ctx.globalAlpha=a;ctx.globalCompositeOperation='source-over';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 16px monospace';
    rect(cx-29,cy-34,58,22,'#18334d');
    rect(cx-26,cy-31,52,2,'#7fbed7');
    ctx.fillStyle='#0b1929';ctx.fillText('MISS!',cx+1,cy-21);
    ctx.fillStyle='#fff9e5';ctx.fillText('MISS!',cx,cy-22);
  }
  ctx.restore();
}

function v51RangePreview(w){

function manualEntries(){let signatures=[['iai','居合残影 · 走りながら斬る','攻撃すると残影状態に。氷で滑る途中も地面の連続歩行中も、通過したマスの周囲に大きな抜刀円弧が重なります。同じ敵への多段ヒットは抑制し、移動が終わると残り時間で周囲を薙ぎます。'],['ricochet','跳ね返る万華弾','正面と斜めに3～5発。壁・岩・盤面端に当たると反射し、弾ごとに残り反射回数がランダムです。細い尾と衝突リングで軌跡を確認できます。'],['chain','連鎖雷撃','正面の敵へ直撃した後、近くの別の敵へ順番に電撃を渡します。各連鎖の経路は細い稲妻で表示し、障害物を抜ける無条件の攻撃にはしません。'],['orbit','旋回護衛刃','発動すると2～3枚の刃が主人公の周囲を巡回。滑走してもついてきて、近寄った敵へ短い間隔で追撃します。大群を抜けたいときに便利です。']].map(([type,name,text])=>({kind:'weapon',type,name,text,group:'武器'}));let basics=MANUAL_CORE.map(([type,name,text])=>({kind:'floor',type,name,text,group:'基本'}));let floors=Object.entries(TERRAIN).filter(([type])=>!['ground','pit','switch','gateA','gateB'].includes(type)).map(([type,name])=>({kind:'floor',type,name,text:type==='brake'?'踏むと停止する床。次の操作で向きを変えられます。':type==='hrail'?'左右方向にだけ通れるゲートです。':type==='vrail'?'上下方向にだけ通れるゲートです。':'矢印の向きから入る場合だけ通れます。逆向きでは手前で停止します。',group:'床と岩'}));let hazards=[...['spike','pendulum','fire','rock'].map(type=>({kind:'hazard',type,name:{spike:'棘床',pendulum:'振り子の鉄球',fire:'火球装置',rock:'往復する岩'}[type],text:'危険な赤マスを避けましょう。緑で休止中のときは触れると装置を壊せます。',group:'罠・ギミック'})),...Object.entries(EXTRA_HAZARDS).map(([type,data])=>({kind:'hazard',type,name:data[0],text:data[3]+'。赤い範囲は危険、緑の休止中は破壊可能です。',group:'罠・ギミック'}))];let monsters=Object.entries(enemyNames).map(([type,name])=>({kind:'enemy',type,name,text:enemyDescription(type)+'。敵の接触や飛び道具に注意。武器でHPを削って倒せます。',hp:enemyHP(type),group:'モンスター'}));return [...basics,...signatures,...Object.entries(V51_INFO).map(([type,[name,text]])=>({kind:'weapon',type,name,text,group:'武器'})),...Object.entries(V54_INFO).map(([type,[name,text]])=>({kind:'weapon',type,name,text,group:'武器'})),...Object.entries(V55_INFO).map(([type,[name,text]])=>({kind:'weapon',type,name,text,group:'武器'})),...uniqueGuides(floors),...hazards,...monsters];}

const V55_TYPES=Object.keys(V55_INFO);

function v55HitCells(cells,power,style,s,limit=1,kind='hit'){

  const area=shape==='lifegrid'?[-2,-1,0,1,2]:[-3,-2,-1,0,1,2,3];
  const [x,y]=v55XY(c),out=[];
  for(const dy of area)for(const dx of (shape==='lifegrid'?[-2,-1,0,1,2]:[-2,-1,0,1,2])){
   let q=v55P(x+dx,y+dy);if(v55Legal(q))out.push(q);
  }

  let near=entities.filter(e=>v55Near(p,e.p)<=7&&v55Path(p,e.p,15).length);
  return [...new Set([...front,...near.map(e=>e.p)])];
 }

  const [x,y]=v55XY(c),out=[];
  for(let i=-4;i<=4;i++){
   const q=v55P(x+(d%2===0?i:0),y+(d%2===1?i:0));

  }

}
function v55Attack(w,now,power){
 if(!board)return;

function v55LifeStep(cells,center){

  const q=v55P(x,y);if(!v55Legal(q))continue;
  let n=0;for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++)if((xx||yy)&&cells.has(v55P(x+xx,y+yy)))n++;
  if(n===3||(cells.has(q)&&n===2))next.add(q);

}
function v55Advance(){

  const age=++s.age,k=s.kind,style=s.style;

function blankCustom(w=13,h=17){return {format:'frostbound',version:1,w,h,cells:Array.from({length:w*h},(_,q)=>q<w||q>=w*(h-1)||q%w===0||q%w===w-1?1:0),start:w+1,goal:w*(h-2)+w-2,frag:[],hazards:[],terrain:[],monsters:[],seed:12345};}
function openEditor(source=null){if(customSession?.imported&&!customSession.unlocked){toast('読み込んだ面はクリア後に編集できます');return;}watchMode=false;mode='editor';genToken++;motion=null;if(source)editorDraft=stageJSON(source);else if(!editorDraft){try{editorDraft=validateCustom(JSON.parse(localStorage.getItem('frostbound.draft')));}catch(e){editorDraft=blankCustom();}}if(source&&!source.monsters){let saveBoard=board;board=prepare(clone(source));pos=board.start;mask=0;protectPath(pos,0,0,0,board.path);setupWorld();editorDraft.monsters=entities.map(e=>({type:e.type,p:e.p}));board=saveBoard;}renderEditor();}
function renderEditor(){let b=editorDraft;modal('<h2>ステージ工房</h2><p class="fine">マスをタップして配置。仕掛けは選択方向へ伸びます。薄氷12枚・仕掛け30基・敵80体・特殊床128枚まで。開始宝箱の武器で敵を攻撃できる解答を検証。敵は主人公のマスへも侵入するため、敵と接触しない配置を確認してください。確認できない配置は遊ぶ・共有を保留します。</p><div class="row"><input id="editW" type="number" min="5" max="31" value="'+b.w+'"><input id="editH" type="number" min="5" max="31" value="'+b.h+'"><button id="resizeEdit">新規盤面</button></div><select id="brush"><option value="ice">氷／消しゴム</option><option value="wall">壁</option><option value="frag">薄氷</option><option value="boulder">押せる岩（16個まで）</option><option value="start">スタート</option><option value="goal">ゴール</option>'+['spike','pendulum','fire','rock'].map((t,i)=>'<option value="'+t+'">'+['棘','振り子5マス','火球発射口＋4マス','動く岩3マス'][i]+'</option>').join('')+Object.entries(EXTRA_HAZARDS).map(([t,n])=>'<option value="'+t+'">'+n[0]+'</option>').join('')+Object.entries(TERRAIN).map(([t,n])=>'<option value="'+t+'">'+n+'</option>').join('')+Object.entries(enemyNames).map(([t,n])=>'<option value="'+t+'">'+n+'</option>').join('')+'</select> <select id="editDir"><option value="1">右</option><option value="2">下</option><option value="3">左</option><option value="0">上</option></select> <select id="editPhase">'+Array.from({length:12},(_,i)=>'<option value="'+i+'">位相 '+i+'</option>').join('')+'</select><div id="editorGrid"></div><p id="editorMsg">編集後に「検証」してください。</p><div class="row"><button id="editCheck">検証</button><button id="editPlay">遊ぶ</button><button id="editDemo">模範解答</button></div><div class="row"><button id="editExport">JSON出力</button><button id="editImport">JSON読込</button></div><input id="jsonFile" type="file" accept=".json,application/json" style="display:none"><textarea id="jsonText" placeholder="JSONを貼り付けて読み込むこともできます"></textarea><button id="pasteImport">貼付JSONを読み込んで遊ぶ</button><button id="editHome">トップへ</button>');paintEditor();$('editPhase').onchange=paintEditor;$('resizeEdit').onclick=()=>{let w=Number($('editW').value),h=Number($('editH').value);if(!Number.isInteger(w)||!Number.isInteger(h)||w<5||w>31||h<5||h>31)return;editorDraft=blankCustom(w,h);renderEditor();};let check=action=>{try{let b=certifyCustom(editorDraft);$('editorMsg').textContent='射程内タップを含む安全解答：'+pathCost(b)+'手';if(action)action(b);}catch(e){$('editorMsg').textContent=e.message;}};$('editCheck').onclick=()=>check();$('editPlay').onclick=()=>check(b=>playCustom(b));$('editDemo').onclick=()=>check(b=>{playCustom(b);genToken++;$('countdown').style.display='none';closeModal();mode='playing';timeUp();stageBriefing(()=>{});});$('editExport').onclick=()=>check(b=>{let text=JSON.stringify(stageJSON(b),null,2);$('jsonText').value=text;let url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='frostbound-stage.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);});const load=text=>{try{if(text.length>100000)throw Error('JSONは100KB以下');let b=certifyCustom(JSON.parse(text));playCustom(b,true);}catch(e){$('editorMsg').textContent=e.message;}};$('editImport').onclick=()=>$('jsonFile').click();$('jsonFile').onchange=async e=>{let f=e.target.files[0];if(f){if(f.size>100000){$('editorMsg').textContent='JSONは100KB以下';return;}load(await f.text());}};$('pasteImport').onclick=()=>load($('jsonText').value);$('editHome').onclick=showTitle;}
function editorImage(){let saved={board,ctx,entities,shots,sparks,drawBroken,pos,mask};try{let c=document.createElement('canvas');c.width=editorDraft.w*24;c.height=editorDraft.h*24;ctx=c.getContext('2d');board=prepare(clone(editorDraft));pos=board.start;mask=0;drawBroken=0;entities=board.monsters.map((e,i)=>({...e,id:'preview'+i,from:e.p,at:-1000}));shots=[];sparks=[];for(let q=0;q<board.cells.length;q++)tile(q,0,pos,0);drawBoulder(0);drawHazards(Number($('editPhase').value||0)*2,0);drawWorld(0);character(pos%board.w*24,(pos/board.w|0)*24,0,false);return c.toDataURL();}finally{board=saved.board;ctx=saved.ctx;entities=saved.entities;shots=saved.shots;sparks=saved.sparks;drawBroken=saved.drawBroken;pos=saved.pos;mask=saved.mask;}}
function paintEditor(){try{localStorage.setItem('frostbound.draft',JSON.stringify(editorDraft));}catch(e){}let b=editorDraft,g=$('editorGrid'),picture=editorImage();g.style.gridTemplateColumns='repeat('+b.w+',24px)';g.innerHTML='';for(let q=0;q<b.cells.length;q++){let btn=document.createElement('button'),haz=b.hazards.find(h=>hazardZone(h).includes(q)),enemy=b.monsters.find(e=>e.p===q);btn.textContent=q===b.start?'S':q===b.goal?'G':enemy?enemyNames[enemy.type]:haz?(EXTRA_HAZARDS[haz.type]?.[0]||{spike:'棘',pendulum:'振り子',fire:'火球',rock:'動く岩'}[haz.type]):TERRAIN[b.tm?.[q]]||TERRAIN[(b.terrain||[]).find(f=>f.p===q)?.type]||(b.frag.includes(q)?'薄氷':'');btn.setAttribute('aria-label',(q%b.w+1)+'列 '+((q/b.w|0)+1)+'行 '+(btn.textContent|| (b.cells[q]?'壁':'氷床')));btn.style.background=b.cells[q]?'#30303b':b.frag.includes(q)?'#cee8fa':'#86aebf';btn.style.backgroundImage='url('+picture+')';btn.style.backgroundPosition=(-q%b.w*24)+'px '+(-(q/b.w|0)*24)+'px';btn.style.width='24px';btn.style.height='24px';btn.style.color='transparent';btn.style.imageRendering='pixelated';btn.onclick=()=>{try{editCell(q);paintEditor();$('editorMsg').textContent='未検証：検証ボタンで確認';}catch(e){$('editorMsg').textContent=e.message;}};g.appendChild(btn);}}
function editCell(q){let b=editorDraft,t=$('brush').value;if((q===b.start||q===b.goal)&&!['start','goal','ice'].includes(t))throw Error('先に開始・ゴールを移動してください');let backup=clone(b),wasGround=(b.terrain||[]).some(f=>f.p===q&&f.type==='ground');try{b.hazards=b.hazards.filter(h=>!hazardZone(h).includes(q));b.monsters=b.monsters.filter(e=>e.p!==q);b.frag=b.frag.filter(p=>p!==q);b.terrain=(b.terrain||[]).filter(f=>f.p!==q);b.boulders=rockStarts(b).filter(p=>p!==q);delete b.boulder;b.cells[q]=t==='wall'?1:0;if(t==='start'||t==='goal')b[t]=q;else if(t==='boulder'){if(b.boulders.length>=16)throw Error('押せる岩は16個まで');b.boulders.push(q);if(wasGround)b.terrain.push({p:q,type:'ground'});}else if(t==='frag')b.frag.push(q);else if(TERRAIN[t])b.terrain.push({type:t,p:q});else if(EXTRA_HAZARDS[t]){let h=makeExtra(t,q,Number($('editDir').value),b.w,b.h,Number($('editPhase').value));if(!h)throw Error('盤面の外には配置できません');b.hazards.push(h);}else if(Object.hasOwn(enemyNames,t))b.monsters.push({type:t,p:q});else if(['spike','pendulum','fire','rock'].includes(t)){let h={type:t,offset:Number($('editPhase').value)};if(t==='spike')h.p=q;else{let d=DIRS[Number($('editDir').value)],n=t==='pendulum'?5:t==='fire'?5:3;h.path=Array.from({length:n},(_,i)=>q+i*d[0]+i*d[1]*b.w);if(t==='fire'){h.wall=q;h.path.shift();}if(t==='pendulum')h.anchor=h.path[2];}b.hazards.push(h);}validateCustom(b);}catch(e){editorDraft=backup;throw e;}}
readSave();layoutMode='auto';refreshLayout();$('layoutToggle').onclick=toggleLayoutMode;$('help').before($('hintDetails'));showTitle();showOrientationChoice();requestAnimationFrame(frame);
